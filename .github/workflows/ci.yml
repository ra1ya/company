name: Company CMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Lint PHP sources
        run: find app bootstrap config database routes tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Verify migrations and demo seed
        run: php artisan migrate:fresh --seed --force

      - name: Verify routes
        run: php artisan route:list

      - name: Compile Blade views
        run: php artisan view:cache

      - name: Run full test suite
        run: php artisan test

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
